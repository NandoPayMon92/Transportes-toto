# Desarrollo / demostración local. Para producción, cambie las credenciales mediante variables de entorno.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: toto
      TZ: UTC
    volumes:
      - datos:/var/lib/postgresql/data
      - ./docker/crear-base-pruebas.sql:/docker-entrypoint-initdb.d/01-pruebas.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toto} -d toto"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toto}:${POSTGRES_PASSWORD}@db:5432/toto?schema=public
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    ports:
      - "3000:3000"

volumes:
  datos:
